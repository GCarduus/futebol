<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Você gosta de futebol?</title>

<style>
:root {
  color-scheme: light dark;
  --bg: light-dark(#f4f6f8,#0c1117);
  --surface: light-dark(#fff,#151c24);
  --text: light-dark(#111827,#f5f7fa);
  --muted: light-dark(#667085,#a9b4c0);
  --accent: #19a463;
  --border: light-dark(#e4e7ec,#27313d);
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  font-family: Arial, sans-serif;
}

body {
  background: var(--bg);
  color: var(--text);
}

#app {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
}

.card {
  width: min(720px, 100%);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 48px;
  text-align: center;
}

.ball {
  font-size: 58px;
  margin-bottom: 8px;
}

h1 {
  font-size: clamp(30px, 6vw, 52px);
  margin: 0 0 12px;
}

p {
  color: var(--muted);
  font-size: 18px;
  margin: 0 0 32px;
}

.buttons {
  display: flex;
  justify-content: center;
  gap: 14px;
}

.btn {
  border: 0;
  border-radius: 14px;
  padding: 15px 34px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.yes {
  background: var(--accent);
  color: white;
}

.no {
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border);
}

#videoArea {
  display: none;
  margin-top: 28px;
}

.videoBox {
  border-radius: 18px;
  overflow: hidden;
  background: #000;
  aspect-ratio: 16 / 9;
}

.videoBox video {
  width: 100%;
  height: 100%;
  display: block;
}
</style>
</head>

<body>

<main id="app">

  <section class="card" id="question">

    <div class="ball">⚽</div>

    <h1>Você gosta de futebol?</h1>

    <p>Escolha uma opção para continuar.</p>

    <div class="buttons">
      <button class="btn yes" id="yes">Sim</button>
      <button class="btn no" id="no">Não</button>
    </div>

    <div id="videoArea">

      <div class="videoBox">
        <video id="footballVideo" controls playsinline></video>
      </div>

    </div>

  </section>

</main>

<script>

// COLOQUE AQUI O NOME DO SEU VÍDEO
const VIDEO_SRC = "Zoeira.mp4";

const yes = document.getElementById("yes");
const no = document.getElementById("no");
const area = document.getElementById("videoArea");
const video = document.getElementById("footballVideo");

yes.addEventListener("click", () => {

  area.style.display = "block";

  video.src = VIDEO_SRC;

  video.play().catch(() => {});

  yes.style.display = "none";
  no.style.display = "none";

});

no.addEventListener("click", () => {

  document.getElementById("question").innerHTML = `
    <div class="ball">😔</div>
    <h1>Tudo bem!</h1>
    <p>Então não há vídeo por aqui.</p>
  `;

});

</script>

</body>
</html>
